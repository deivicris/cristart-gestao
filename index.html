<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14121B">
<title>CristART 3D · Gestão</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2300AEEF'/%3E%3Cstop offset='.55' stop-color='%238B2FF0'/%3E%3Cstop offset='1' stop-color='%23E026C9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/app.css?v=7">
</head>
<body>

<!-- LOGIN -->
<section id="login" class="login hidden">
  <form id="login-form" class="login-card" autocomplete="on">
    <div class="brand"><div class="brand-mark"></div><div><div class="brand-name">CristART 3D</div><div class="brand-sub">GESTÃO</div></div></div>
    <div id="login-title" class="muted">Entre com o seu e-mail e senha.</div>
    <div class="field" id="f-email"><label for="email">E-mail</label><input id="email" class="inp" type="email" autocomplete="username" required></div>
    <div class="field" id="f-senha"><label for="senha">Senha</label><input id="senha" class="inp" type="password" autocomplete="current-password" required></div>
    <div class="field hidden" id="f-nova"><label for="nova">Nova senha (mín. 8 caracteres)</label><input id="nova" class="inp" type="password" autocomplete="new-password" minlength="8"></div>
    <div id="login-err" class="err hidden"></div>
    <button id="login-btn" class="btn btn-p" type="submit">Entrar</button>
    <button id="forgot-btn" class="btn btn-g" type="button">Esqueci a senha</button>
  </form>
</section>

<!-- APP -->
<div id="app" class="shell hidden">
  <aside id="side" class="side" aria-label="Menu">
    <div class="brand"><div class="brand-mark"></div><div><div class="brand-name">CristART 3D</div><div class="brand-sub">GESTÃO</div></div></div>
    <nav id="nav" class="stack" style="gap:3px"></nav>
    <div class="side-foot">
      <div id="who">—</div>
      <button id="logout" type="button">Sair</button>
    </div>
  </aside>
  <div id="scrim" class="scrim hidden"></div>
  <main class="main">
    <header class="top">
      <button id="menu-btn" class="menu-btn" type="button" aria-label="Abrir menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="grow"><div class="lbl" id="crumb">CristART 3D · Gestão</div><h1 id="title">Painel</h1></div>
      <div class="row top-actions" id="top-actions"></div>
    </header>
    <div id="view" class="content"><div class="loading">Carregando…</div></div>
  </main>
</div>

<div id="modal-root"></div>

<script src="js/vendor/supabase.js"></script>
<script src="js/config.js?v=7"></script>
<script src="js/app.js?v=7"></script>
</body>
</html>
